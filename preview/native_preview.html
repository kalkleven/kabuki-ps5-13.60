<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native Overlay Preview</title>
<style>
  :root { --bg: #0d0f12; --panel: #171a1f; --ink: #e6e7ea; --dim: #8b9099; --accent: #6ea8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  #stage { position: relative; width: min(100%, calc((100vh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; margin: 0 auto; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; background: var(--panel); }
  #bar label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
  #bar select, #bar button { background: #22262d; color: var(--ink); border: 1px solid #333944; border-radius: 6px; padding: 4px 8px; }
  #status, #cursor { font-family: ui-monospace, monospace; color: var(--dim); }
  #log { padding: 6px 16px; font-family: ui-monospace, monospace; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  kbd { background: #22262d; border: 1px solid #333944; border-radius: 4px; padding: 0 4px; color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><canvas id="view"></canvas></div>
<div id="bar">
  <button id="toggle">Open (Space)</button>
  <label>Backdrop <select id="backdrop"><option value="">Dark</option></select></label>
  <label>Compare <select id="ref"><option value="">None</option></select></label>
  <label>Opacity <input id="refAlpha" type="range" min="0" max="1" step="0.05" value="0.5"></label>
  <label title="Moves the screenshot left: 120 lines the console's own card up with ours">Shift <input id="refShift" type="number" value="0" step="1" style="width:64px"></label>
  <label><input id="grid" type="checkbox"> Boxes</label>
  <span id="cursor"></span>
  <span id="status"></span>
  <span style="color:var(--dim)"><kbd>Space</kbd> open · arrows · <kbd>Enter</kbd> Cross · <kbd>Esc</kbd> Circle · <kbd>Q</kbd>/<kbd>E</kbd> L1/R1 · <kbd>S</kbd> Square</span>
</div>
<div id="log"></div>
<script>
'use strict';
const canvas = document.getElementById('view');
let ctx = canvas.getContext('2d');
const LIFT = 0.12; // native_layout.hpp kLabelLift: capitals sit this far (x size) above a label box's middle
const WEIGHTS = {0: 400, 1: 700, 2: 300, 3: 500, 4: 300, 5: 700, 6: 500};
const KINDS = ['face', 'rounded', 'disc', 'veil', 'ring', 'sweep'];
let open = 0, held = 0, pressed = 0, circle = 0, frame = null, busy = false, linked = 1;
const skins = {}, images = {}, tinted = {}, marquees = {};
const log = [];

for (const [file, weight] of [['SST-Light.otf', 300], ['SST-Roman.otf', 400], ['SST-Medium.otf', 500], ['SST-Bold.otf', 700]]) {
  const face = new FontFace('SST', `url(/font/${file})`, {weight: String(weight)});
  face.load().then(f => document.fonts.add(f));
}
fetch('/refs').then(r => r.json()).then(names => {
  for (const id of ['backdrop', 'ref']) for (const n of names) document.getElementById(id).add(new Option(n, n));
});
let backdrop = null, ref = null;
document.getElementById('backdrop').onchange = e => { backdrop = e.target.value ? loadImage('/ref/' + e.target.value) : null; };
document.getElementById('ref').onchange = e => { ref = e.target.value ? loadImage('/ref/' + e.target.value) : null; };

function loadImage(src) {
  if (images[src]) return images[src];
  const img = new Image(); img.src = src; images[src] = img;
  img.onerror = () => setTimeout(() => { if (images[src] === img) delete images[src]; }, 1500); // try again
  return img;
}
function uriSource(uri) {
  if (!uri) return null;
  if (uri.startsWith('cxml://custom_overlay/')) return loadImage('/icon/' + uri.slice(22));
  if (uri.startsWith('cxml://custom_common/')) return loadImage('/common/' + uri.slice(21));
  return loadImage('/file?path=' + encodeURIComponent(uri));
}
function skinCanvas(w) {
  if (!(w.id in skins)) {
    skins[w.id] = null;
    fetch('/skin/' + w.id).then(r => r.json()).then(s => {
      if (!s) return;
      const raw = atob(s.pixels), data = new Uint8ClampedArray(raw.length);
      for (let i = 0; i < raw.length; ++i) data[i] = raw.charCodeAt(i);
      const c = document.createElement('canvas'); c.width = s.pw; c.height = s.ph;
      c.getContext('2d').putImageData(new ImageData(data, s.pw, s.ph), 0, 0);
      skins[w.id] = c;
    });
  }
  return skins[w.id];
}
// PUI's FilterColor multiplies the picture; drawn into a cached canvas at the shown size.
function tint(src, key, pw, ph, t) {
  const k = key + '|' + pw + 'x' + ph + '|' + t.slice(0, 3).map(v => v.toFixed(3)).join(',');
  let c = tinted[k];
  if (c) return c;
  c = document.createElement('canvas'); c.width = pw; c.height = ph;
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0, pw, ph);
  if (t[0] < 1 || t[1] < 1 || t[2] < 1) {
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = `rgb(${t[0] * 255},${t[1] * 255},${t[2] * 255})`; g.fillRect(0, 0, pw, ph);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(src, 0, 0, pw, ph);
  }
  if (Object.keys(tinted).length > 600) for (const key of Object.keys(tinted)) delete tinted[key];
  return tinted[k] = c;
}

function draw(target) {
  let pw, ph;
  if (target) { pw = target.width; ph = target.height; }
  else {
    const rect = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    pw = Math.round(rect.width * dpr); ph = Math.round(rect.height * dpr);
    if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  }
  const unit = pw / 1920;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, pw, ph);
  ctx.setTransform(unit, 0, 0, unit, 0, 0);
  if (backdrop && backdrop.complete && backdrop.naturalWidth) ctx.drawImage(backdrop, 0, 0, 1920, 1080);
  else { const g = ctx.createLinearGradient(0, 0, 1920, 1080); g.addColorStop(0, '#2b3a55'); g.addColorStop(1, '#4a2f3f'); ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080); }
  if (frame) {
    const kids = {};
    for (const w of frame.widgets) (kids[w.parent] = kids[w.parent] || []).push(w);
    const boxes = document.getElementById('grid').checked;
    const node = (w, alpha) => {
      if (!w.visible) return;
      const a = alpha * w.alpha;
      if (a <= 0.001) return;
      const [x, y, bw, bh] = w.box;
      ctx.save();
      ctx.translate(x, y);
      if (w.scale) { ctx.translate(bw / 2, bh / 2); ctx.scale(w.scale, w.scale); ctx.translate(-bw / 2, -bh / 2); }
      if (w.clip) { ctx.beginPath(); ctx.rect(0, 0, bw, bh); ctx.clip(); }
      ctx.globalAlpha = a;
      const scale = unit * (w.scale || 1);
      if (w.type === 'skin') {
        const c = skinCanvas(w);
        if (c) ctx.globalAlpha = a * w.tint[3], ctx.drawImage(tint(c, 's' + w.id, c.width, c.height, w.tint), 0, 0, bw, bh);
      } else if (w.type === 'image') {
        const img = uriSource(w.uri);
        if (img && img.complete && img.naturalWidth) {
          // ImageScaleType AspectInside: fitted and centred.
          const r = Math.min(bw / img.naturalWidth, bh / img.naturalHeight), dw = img.naturalWidth * r, dh = img.naturalHeight * r;
          const px = Math.max(1, Math.round(dw * scale)), py = Math.max(1, Math.round(dh * scale));
          ctx.globalAlpha = a * w.tint[3];
          ctx.drawImage(tint(img, w.uri, px, py, w.tint), (bw - dw) / 2, (bh - dh) / 2, dw, dh);
        }
      } else if (w.type === 'label' && w.text) label(w, bw, bh);
      if (boxes && w.type !== 'screen') { ctx.globalAlpha = 0.7; ctx.strokeStyle = w.type === 'label' ? '#ff5c8a' : '#5cc8ff'; ctx.lineWidth = 1 / unit; ctx.strokeRect(0, 0, bw, bh); }
      for (const k of kids[w.id] || []) node(k, a);
      ctx.restore();
    };
    for (const w of kids[-1] || []) node(w, 1);
  }
  if (ref && ref.complete && ref.naturalWidth) {
    ctx.globalAlpha = +document.getElementById('refAlpha').value;
    ctx.drawImage(ref, -(+document.getElementById('refShift').value || 0), 0, 1920, 1080 * ref.naturalHeight / ref.naturalWidth * 16 / 9);
    ctx.globalAlpha = 1;
  }
}

function label(w, bw, bh) {
  ctx.font = `${WEIGHTS[w.weight]} ${w.size}px SST`;
  ctx.fillStyle = `rgb(${w.colour[0] * 255},${w.colour[1] * 255},${w.colour[2] * 255})`;
  ctx.textBaseline = 'alphabetic';
  const cap = ctx.measureText('H').actualBoundingBoxAscent;
  const baseline = bh / 2 - LIFT * w.size + cap / 2;
  let text = w.text, width = ctx.measureText(text).width;
  if (width <= bw) {
    const x = w.align === 2 ? bw - width : w.align === 1 ? (bw - width) / 2 : 0;
    ctx.fillText(text, x, baseline);
    return;
  }
  if (w.trim === 6) { // RoundMarquee: still for a moment, then round and round
    const m = marquees[w.id] && marquees[w.id].text === text ? marquees[w.id] : (marquees[w.id] = {text, since: performance.now()});
    const gap = w.size * 3, loop = width + gap, t = (performance.now() - m.since) / 1000;
    const offset = t < 2 ? 0 : ((t - 2) * 60) % loop;
    ctx.save(); ctx.beginPath(); ctx.rect(0, -bh, bw, bh * 3); ctx.clip();
    ctx.fillText(text, -offset, baseline); ctx.fillText(text, -offset + loop, baseline);
    ctx.restore();
    return;
  }
  while (text.length && ctx.measureText(text + '…').width > bw) text = text.slice(0, -1);
  ctx.fillText(text + '…', 0, baseline);
}

// A 4K picture of the current frame, saved by the server as build/native-preview/snapshot.png.
window.snapshot = async () => {
  const c = document.createElement('canvas'); c.width = 3840; c.height = 2160;
  const keep = ctx; ctx = c.getContext('2d');
  try { draw(c); } finally { ctx = keep; }
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return (await fetch('/snapshot', {method: 'POST', body: blob})).status;
};

// Input: the console's pad bits.
const KEYS = {ArrowUp: 0x10, ArrowRight: 0x20, ArrowDown: 0x40, ArrowLeft: 0x80, Enter: 0x4000, KeyX: 0x4000,
              KeyQ: 0x400, KeyE: 0x800, KeyS: 0x8000};
const keys = new Set();
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { open ^= 1; e.preventDefault(); return; }
  if (e.code === 'KeyL') { linked ^= 1; e.preventDefault(); return; } // librespot running or not
  if (e.code === 'Escape' || e.code === 'Backspace' || e.code === 'KeyC') { if (!e.repeat) circle = 1; e.preventDefault(); return; }
  const bit = KEYS[e.code];
  if (!bit) return;
  e.preventDefault();
  if (!keys.has(e.code)) { keys.add(e.code); pressed |= bit; }
});
addEventListener('keyup', e => keys.delete(e.code));
document.getElementById('toggle').onclick = () => { open ^= 1; };
let padPrev = 0;
function padBits() {
  let bits = 0, circleNow = false, toggle = false;
  for (const p of navigator.getGamepads ? navigator.getGamepads() : []) {
    if (!p) continue;
    const b = i => p.buttons[i] && p.buttons[i].pressed;
    if (b(0)) bits |= 0x4000; if (b(2)) bits |= 0x8000; if (b(4)) bits |= 0x400; if (b(5)) bits |= 0x800;
    if (b(12) || p.axes[1] < -0.55) bits |= 0x10; if (b(13) || p.axes[1] > 0.55) bits |= 0x40;
    if (b(14) || p.axes[0] < -0.55) bits |= 0x80; if (b(15) || p.axes[0] > 0.55) bits |= 0x20;
    if (b(1)) circleNow = true;
    if (b(10) && b(11)) toggle = true;
    break;
  }
  const edges = (circleNow ? 1 : 0) | (toggle ? 2 : 0);
  if (edges & 1 && !(padPrev & 1)) circle = 1;
  if (edges & 2 && !(padPrev & 2)) open ^= 1;
  padPrev = edges;
  return bits;
}
let padHeld = 0;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 1920, y = (e.clientY - r.top) / r.height * 1080;
  let text = `x ${x.toFixed(1)}  y ${y.toFixed(1)}`;
  if (x >= 1196 && x <= 1716) text += `  · card ${(x - 1196).toFixed(1)}, ${(y - 135).toFixed(1)}`;
  document.getElementById('cursor').textContent = text;
});

async function step() {
  if (!busy) {
    busy = true;
    const pad = padBits();
    let keyBits = 0;
    for (const k of keys) keyBits |= KEYS[k] || 0;
    const now = keyBits | pad;
    const send = pressed | (pad & ~padHeld);
    padHeld = pad;
    const sentOpen = open;
    const url = `/frame?held=${now}&pressed=${send}&circle=${circle}&open=${open}&linked=${linked}`;
    pressed = 0; circle = 0;
    try {
      frame = await (await fetch(url)).json();
      if (sentOpen && !frame.open && open) open = 0; // Circle on the rail closes
      for (const c of frame.commands) log.push(`kind ${c.kind} value ${c.value}${c.text ? ' "' + c.text + '"' : ''}`);
      const SOUNDS = {0: 'focus', 1: 'back', 2: 'decide', 8: 'list decide', 9: 'list move', 10: 'menu open', 12: 'popup', 19: 'close', 21: 'slider', 22: 'switch on', 23: 'switch off', 28: 'tab', 30: 'end', 100: 'menu close', 101: 'play/pause', 102: 'skip'};
      for (const t of frame.sounds || []) log.push('sound ' + (SOUNDS[t] || t));
      while (log.length > 6) log.shift();
      const v = frame.view;
      document.getElementById('status').textContent = `tab ${v.tab} rail ${v.rail} ${v.focused ? 'card' : 'rail'} control ${v.control}${v.seek ? ' seek' : ''}${v.popup ? ' popup ' + v.popup : ''}`;
      document.getElementById('log').textContent = log.length ? 'sent: ' + log.join('  ·  ') : 'sent: nothing yet';
      document.getElementById('toggle').textContent = open ? 'Close (Space)' : 'Open (Space)';
    } catch (e) { document.getElementById('status').textContent = 'preview server stopped'; }
    busy = false;
  }
  draw();
  setTimeout(step, 16); // a timer, not animation frames: the pane may not be painting
}
setTimeout(step, 0);
</script>
</body>
</html>
